---
# -----------------------------------------------------------------------------
# Pi
# -----------------------------------------------------------------------------
# Use Pi's documented npm installation with lifecycle scripts disabled. Keep
# the application in the agent account's npm prefix so pi update needs no sudo.
# Credentials and sessions remain user-managed and are never provisioned here.
# -----------------------------------------------------------------------------

- name: Pi | Query stable releases in the selected major series
  ansible.builtin.command:
    argv:
      - /usr/bin/npm
      - view
      - "@earendil-works/pi-coding-agent@{{ agents_pi_version }}"
      - version
      - --json
  register: agents__pi_releases
  changed_when: false
  check_mode: false
  when: agents_pi_version == '1.x'
  tags: pi

- name: Pi | Resolve the exact desired version
  ansible.builtin.set_fact:
    agents__pi_version: >-
      {{ (([agents__pi_releases.stdout | from_json] | flatten)
          | community.general.version_sort | last)
         if agents_pi_version == '1.x' else agents_pi_version }}
  tags: pi

- name: Pi | Install the selected harness for the agent account
  become: true
  become_user: "{{ agents_user }}"
  community.general.npm:
    name: "@earendil-works/pi-coding-agent"
    version: "{{ agents__pi_version }}"
    global: true
    ignore_scripts: true
    executable: /usr/bin/npm
    state: present
  environment:
    HOME: "{{ agents__home }}"
    PATH: "{{ agents__home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
    npm_config_prefix: "{{ agents__home }}/.local"
  tags: pi
