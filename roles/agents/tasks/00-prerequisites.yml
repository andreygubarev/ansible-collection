---
# -----------------------------------------------------------------------------
# Prerequisite
# -----------------------------------------------------------------------------
# Use the signed NodeSource Node.js 24 LTS repository on both distributions.
# Validate the target and release selectors before making system-wide changes.
# -----------------------------------------------------------------------------

- name: Prerequisite | Assert OS is supported
  ansible.builtin.assert:
    that:
      - >-
        (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] == '26.04')
        or (ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] == '13')
    fail_msg: "This role requires Ubuntu 26.04 or Debian 13."
  tags: always

- name: Prerequisite | Assert architecture is supported
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    fail_msg: "This role requires amd64 or arm64 architecture."
  tags: always

- name: Prerequisite | Validate the agent account name
  ansible.builtin.assert:
    that:
      - agents_user is string
      - agents_user is match('^[a-z_][a-z0-9_-]{0,31}$')
      - agents_user != 'root'
    fail_msg: "agents_user must be a non-root Linux account name of at most 32 characters."
  tags: always

- name: Prerequisite | Resolve the agent home directory
  ansible.builtin.set_fact:
    agents__home: "/home/{{ agents_user }}"
  tags: always

- name: Prerequisite | Validate Pi version
  ansible.builtin.assert:
    that:
      - agents_pi_version is string
      - agents_pi_version is match('^1[.]([0-9]+[.][0-9]+|x)$')
    fail_msg: "agents_pi_version must be 1.x or an exact stable 1.x.y version without a v prefix."
  tags: always

- name: Prerequisite | Validate Claude Code version
  ansible.builtin.assert:
    that:
      - agents_claude_code_version is string
      - agents_claude_code_version == 'latest' or agents_claude_code_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')
    fail_msg: "agents_claude_code_version must be latest or an exact stable version without a v prefix."
  tags: always

- name: Prerequisite | Validate BB version
  ansible.builtin.assert:
    that:
      - agents_bb_version is string
      - agents_bb_version == 'latest' or agents_bb_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')
    fail_msg: "agents_bb_version must be latest or an exact stable version without a v prefix."
  tags: always

- name: Prerequisite | Validate Pi Web Access version
  ansible.builtin.assert:
    that:
      - agents_pi_web_access_version is string
      - agents_pi_web_access_version == 'latest' or agents_pi_web_access_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')
    fail_msg: "agents_pi_web_access_version must be latest or an exact stable version without a v prefix."
  tags: always

- name: Prerequisite | Require systemd
  ansible.builtin.assert:
    that:
      - ansible_facts['service_mgr'] == 'systemd'
    fail_msg: "This role requires systemd for the persistent BB user service."
  tags: always
