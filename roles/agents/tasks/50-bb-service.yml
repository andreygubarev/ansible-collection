---
# -----------------------------------------------------------------------------
# BB service
# -----------------------------------------------------------------------------
# Linger starts the user manager at boot without a login session. Address that
# manager's bus explicitly so provisioning works over SSH and after reboot.
# Keep BB on loopback: its local API is not an authenticated public endpoint.
# -----------------------------------------------------------------------------

- name: BB service | Configure the persistent user service
  become: true
  tags: bb
  block:
    - name: BB service | Create user unit directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ agents_user }}"
        group: "{{ agents_user }}"
        mode: "0700"
      loop:
        - "{{ agents__home }}/.config"
        - "{{ agents__home }}/.config/systemd"
        - "{{ agents__home }}/.config/systemd/user"

    - name: BB service | Write the user unit
      ansible.builtin.copy:
        dest: "{{ agents__home }}/.config/systemd/user/bb.service"
        content: |
          # Source: https://github.com/andreygubarev/ansible-collection
          [Unit]
          Description=BB agent server

          [Service]
          Type=simple
          WorkingDirectory={{ agents__home }}
          Environment=PATH={{ agents__home }}/.local/bin:/usr/local/bin:/usr/bin:/bin
          Environment=BB_DATA_DIR={{ agents__home }}/.bb
          ExecStart=%h/.local/bin/bb-app --server-bind-host 127.0.0.1{{ ' --bundled --no-in-app-updates' if agents_bb_version != 'latest' else '' }}
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=default.target
        owner: "{{ agents_user }}"
        group: "{{ agents_user }}"
        mode: "0644"
      register: agents__bb_unit

    - name: BB service | Enable linger for boot without login
      ansible.builtin.command:
        argv:
          - /usr/bin/loginctl
          - enable-linger
          - "{{ agents_user }}"
        creates: "/var/lib/systemd/linger/{{ agents_user }}"

    - name: BB service | Start the user manager
      ansible.builtin.systemd_service:
        name: "user@{{ agents__user.uid }}.service"
        state: started

    - name: BB service | Wait for the user bus
      ansible.builtin.wait_for:
        path: "/run/user/{{ agents__user.uid }}/bus"
        timeout: 30
      when: not ansible_check_mode

    - name: BB service | Enable and start the server
      become: true
      become_user: "{{ agents_user }}"
      ansible.builtin.systemd_service:
        name: bb.service
        scope: user
        enabled: true
        daemon_reload: "{{ agents__bb_unit is changed }}"
        state: >-
          {{ 'restarted' if agents__bb_unit is changed or agents__bb_package is changed
             or (agents__runtime_packages is defined and agents__runtime_packages is changed) else 'started' }}
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ agents__user.uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ agents__user.uid }}/bus"

    - name: BB service | Wait for the local web interface
      ansible.builtin.uri:
        url: http://127.0.0.1:38886/
      register: agents__bb_http
      until: agents__bb_http.status == 200
      retries: 30
      delay: 2
      when: not ansible_check_mode
