---
# -----------------------------------------------------------------------------
# Prerequisite
# -----------------------------------------------------------------------------
# Reject unsupported hosts and settle first-boot package work before mutation.
# These checks also apply to selective execution.
# -----------------------------------------------------------------------------

- name: Prerequisite | Assert OS is supported
  ansible.builtin.assert:
    that:
      - >-
        (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] == '26.04')
        or (ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] == '13')
    fail_msg: >-
      This role requires Ubuntu 26.04 or Debian 13
      (detected {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}).
  tags: always

- name: Prerequisite | Assert architecture is supported
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] in ["x86_64", "aarch64"]
    fail_msg: >-
      This role requires amd64 or arm64 architecture
      (detected {{ ansible_facts['architecture'] }})
    success_msg: "Architecture check passed: {{ ansible_facts['architecture'] }}"
  tags: always

- name: Prerequisite | Get cloud-init
  ansible.builtin.stat:
    path: /usr/bin/cloud-init
  register: kubernetes__cloud_init
  tags: always

- name: Prerequisite | Wait for cloud-init to finish
  ansible.builtin.command:
    argv:
      - timeout
      - "1800"
      - /usr/bin/cloud-init
      - status
      - --wait
  register: kubernetes__cloud_init_timeout
  # This is an APT-lock barrier; rc=1 can mean cloud-init is done but recorded errors.
  failed_when: kubernetes__cloud_init_timeout.rc not in [0, 1, 2]
  changed_when: false
  when: kubernetes__cloud_init.stat.exists
  tags: always

- name: Prerequisite | Report cloud-init completed with errors
  ansible.builtin.debug:
    msg: >-
      cloud-init completed with errors before this role started. Continuing
      because boot-time package work is no longer running; inspect
      'cloud-init status --long' and /var/log/cloud-init.log for root cause.
  when:
    - kubernetes__cloud_init.stat.exists
    - kubernetes__cloud_init_timeout.rc == 1
  tags: always

- name: Prerequisite | Check Debian runtime package ownership
  when: ansible_facts['distribution'] == 'Debian'
  tags: always
  block:
    - name: Prerequisite | Read installed Debian packages
      ansible.builtin.package_facts:
        manager: apt

    - name: Prerequisite | Require explicit migration of conflicting runtimes
      ansible.builtin.assert:
        that:
          - "'containerd' not in ansible_facts['packages']"
          - "'runc' not in ansible_facts['packages']"
        fail_msg: >-
          Debian 13 uses Docker's containerd.io 2.x package. Existing distro
          containerd/runc packages require an explicit runtime migration;
          this role never removes them automatically.
