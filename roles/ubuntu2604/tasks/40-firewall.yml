---
# -----------------------------------------------------------------------------
# Firewall
# -----------------------------------------------------------------------------
# Use nftables without clearing tables owned by Kubernetes, CNI, or Tailscale.
# Filtering rules remain the responsibility of each service or site policy.
# -----------------------------------------------------------------------------

- name: Firewall | Install netfilter tools
  become: true
  ansible.builtin.apt:
    name:
      - conntrack
      - iptables
      - nftables
    state: present
    install_recommends: false
  tags: [firewall, packages]

- name: Firewall | Use nftables-backed compatibility commands
  become: true
  community.general.alternatives:
    name: "{{ item.name }}"
    path: "{{ item.path }}"
  tags: firewall
  loop:
    - name: iptables
      path: /usr/sbin/iptables-nft
    - name: ip6tables
      path: /usr/sbin/ip6tables-nft
    - name: arptables
      path: /usr/sbin/arptables-nft
    - name: ebtables
      path: /usr/sbin/ebtables-nft
  loop_control:
    label: "{{ item.name }}"

- name: Firewall | Preserve independently managed tables on reload
  become: true
  ansible.builtin.lineinfile:
    path: /etc/nftables.conf
    regexp: '^\s*flush\s+ruleset\s*;?\s*(#.*)?$'
    state: absent
  tags: firewall

- name: Firewall | Enable nftables service
  become: true
  ansible.builtin.systemd_service:
    name: nftables
    state: started
    enabled: true
  tags: firewall

# Minimal images may omit UFW entirely; masking below still prevents its activation.
- name: Firewall | Read available services
  become: true
  ansible.builtin.service_facts:
  tags: firewall

- name: Firewall | Stop and disable UFW service
  become: true
  ansible.builtin.systemd_service:
    name: ufw
    state: stopped
    enabled: false
  when: "'ufw.service' in ansible_facts['services']"
  tags: firewall

- name: Firewall | Mask UFW service
  become: true
  ansible.builtin.systemd_service:
    name: ufw
    masked: true
  tags: firewall
