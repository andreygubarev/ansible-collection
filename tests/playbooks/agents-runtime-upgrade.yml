---
- name: Prepare the former Ubuntu agent runtime on the disposable test VM
  hosts: incus_test
  become: true
  vars:
    agents_user: agent
    agents__home: /home/agent
  tasks:
    - name: Test | Require the Ubuntu baseline
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - incus_test_baseline == 'ubuntu2604'

    - name: Test | Install distro Node.js and npm
      ansible.builtin.apt:
        name:
          - acl
          - nodejs
          - npm
          - git
          - build-essential
          - python3
          - sudo
          - dbus-user-session
          - libpam-systemd
        state: present
        update_cache: true
        cache_valid_time: 3600
        install_recommends: false
        lock_timeout: 600

    - name: Test | Install BB with the distro runtime
      community.general.npm:
        name: bb-app
        global: true
        ignore_scripts: false
        executable: /usr/bin/npm
        state: present
      environment:
        npm_config_prefix: /usr/local
        npm_config_allow_scripts: better-sqlite3,node-pty,@parcel/watcher
      register: agents__bb_package

    - name: Test | Prepare the existing agent account
      ansible.builtin.include_role:
        name: andreygubarev.com.agents
        tasks_from: 15-user.yml

    - name: Test | Create the former service's unit directory
      ansible.builtin.file:
        path: /home/agent/.config/systemd/user
        state: directory
        owner: agent
        group: agent
        mode: "0700"

    - name: Test | Write the former system-wide BB launcher unit
      ansible.builtin.copy:
        dest: /home/agent/.config/systemd/user/bb.service
        content: |
          [Unit]
          Description=BB agent server
          [Service]
          Type=simple
          WorkingDirectory=/home/agent
          Environment=PATH=/usr/local/bin:/usr/bin:/bin
          Environment=BB_DATA_DIR=/home/agent/.bb
          ExecStart=/usr/local/bin/bb-app --server-bind-host 127.0.0.1 --no-in-app-updates
          Restart=on-failure
          RestartSec=5
          [Install]
          WantedBy=default.target
        owner: agent
        group: agent
        mode: "0644"

    - name: Test | Enable the former service's user manager at boot
      ansible.builtin.command:
        argv:
          - /usr/bin/loginctl
          - enable-linger
          - agent
        creates: /var/lib/systemd/linger/agent

    - name: Test | Start the former service's user manager
      ansible.builtin.systemd_service:
        name: "user@{{ agents__user.uid }}.service"
        state: started

    - name: Test | Start BB with the distro runtime
      become: true
      become_user: agent
      ansible.builtin.systemd_service:
        name: bb.service
        scope: user
        enabled: true
        state: started
        daemon_reload: true
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ agents__user.uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ agents__user.uid }}/bus"

    - name: Test | Verify native add-ons work before the runtime transition
      ansible.builtin.command:
        argv:
          - /usr/bin/node
          - -e
          - |
            const { createRequire } = require('node:module');
            const requireBB = createRequire('/usr/local/lib/node_modules/bb-app/package.json');
            const db = new (requireBB('better-sqlite3'))(':memory:');
            if (db.prepare('SELECT 1').pluck().get() !== 1) throw new Error('SQLite failed');
            db.close();
            requireBB('node-pty');
            requireBB('@parcel/watcher');
            console.log(process.version, process.versions.modules);
      register: test_legacy_node
      changed_when: false

    - name: Test | Report the original Node.js version and module ABI
      ansible.builtin.debug:
        msg: "{{ test_legacy_node.stdout }}"
