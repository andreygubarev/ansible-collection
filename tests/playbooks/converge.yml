---
- name: Apply the selected host baseline to the test VM
  hosts: incus_test
  become: true
  tasks:
    - name: Test | Apply the image's baseline
      ansible.builtin.include_role:
        name: "andreygubarev.com.{{ incus_test_baseline }}"
      tags: always

- name: Apply Kubernetes after the host baseline
  hosts: incus_test
  become: true
  roles:
    - andreygubarev.com.kubernetes

- name: Apply Terraform tooling for the test user
  hosts: incus_test
  roles:
    - andreygubarev.com.terraform

- name: Prepare the GitOps workspace without applying workloads
  hosts: incus_test
  roles:
    - andreygubarev.com.gitops

- name: Install the Pi harness
  hosts: incus_test
  vars:
    # Exercise temporary-file ACL sharing when becoming the unprivileged bb user.
    ansible_pipelining: false
  roles:
    - andreygubarev.com.agents

- name: Wait for the cluster
  ansible.builtin.import_playbook: ready.yml
